[project]
name = "model-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=1.15.0",
    "diffusers>=0.35",
    "ftfy>=6.3.1",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
